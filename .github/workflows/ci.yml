name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet test tests/ToolControl.Core.Tests/ToolControl.Core.Tests.csproj

  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet restore ToolControl.sln
      - run: msbuild ToolControl.sln /p:Configuration=Release /m
      - run: dotnet test tests/ToolControl.Core.Tests/ToolControl.Core.Tests.csproj --no-build -c Release
